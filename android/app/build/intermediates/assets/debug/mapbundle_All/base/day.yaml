      road_emblem_motorway:
        filter:
          all:
          - $zoom: {min: 7, max: 16}
          - class: [motorway]
          - not: {brunnel: [bridge, tunnel]}
          - ramp: no
          - function() { return typeof feature.highwaynum !== 'undefined' && typeof
            feature.highwaycode !== 'undefined' && typeof feature.highwaynumlen !==
            'undefined'; }
        textured_emblem:
          filter:
            all:
            - function() { return true; }
          draw:
            points:
              placement: midpoint
              placement_min_length_ratio: [[6, 0.3], [11, 1.0], [14, 1.4], [16, 8.0],
                [20, 20.0]]
              #size: [[6, 10px], [14, 20px]]  # Adjust the size as necessary                    
              size: [24px, 24px]
              scalex: |
                function() {
                  var scale = 1.0;
                  if( feature.highwaynumlen > 2) {
                    scale = feature.highwaynumlen * 0.4;
                  }
                  return scale;
                }
              texture: motorway_emblem #function() { return feature.highwaycode; }
              collide: true
              priority: 2.5
              color: white
              text:
                #######an important observation################
                # this works text_source: function() { return feature.ref; }
                # this DOES NOT WORK  text_source: feature.ref
                #############
                text_source: function() { return feature.highwaynum; }
                anchor: center
