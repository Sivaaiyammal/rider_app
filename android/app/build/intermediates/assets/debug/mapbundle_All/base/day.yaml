global:
  default_text_source: |
    function() {
      if (feature.ref && feature.name ) { return feature.ref +" " + feature.name_en      ; } else if (feature.name_en      ) { return feature.name_en      ; } else { return feature.ref; }
    }
  name_source: |
    function() {
      if (feature.name_en      ) { return feature.name_en      ; } else if (feature.name) { return feature.name; }
    }  
  house_number: |
    function() {
      { return feature.housenumber; }
    }  
  refn_source: |
    function() {
        if (feature.name_en      ) { return feature.name_en      ; } else if (feature.name) { return feature.name; } else if (feature.ref) { return feature.ref; }
    }
  elev_source: |
    function() {
      if(feature.elev) { return feature.elev + "m"; } else { return ""; }
    }
  get_elevMax_from_tile: |
    function() { return 4; }  
  ###########
  poiSize: 32
  navImageSizeMultiplier: 2.0
  poiTheme: day
  poiDensity: 2
fonts:
  default:
    url: fonts/NotoSans-All.woff
  NEFontMainA:
    url: fonts/NotoSans-All.woff
  NEFontSansSeriffExtraBold:
    url: fonts/OpenSans-ExtraBold.woff
scene:
  background:
    color: [0.929, 0.902, 0.882, 1.00]
cameras:
  map-camera:
    #position: [54.344354,24.469401, 16] #for corniche
    #position: [54.393255, 24.470888, 18] #for road label, route line check after press I    
    #position: [13.197474, 52.420583,17] #for berlin
    #position: [80.101637, 12.9158267, 18] #for chennai
    #position: [92.694959, 11.950336, 16.32443] #for chennai
    position: [80.269609, 13.020800, 16] #for chennai/MRC
    #position: [54.393201, 24.446266, 14] #for abu dhabi
    #position: [52.307659, 24.513139, 14] #for dalma contour raster
    #position: [80.2707, 13.0827, 12] #for JV in tiles-jv @ dubai. Almahktoum and Sheik bin
    type: isometric
    axis: [0, 1]
    active: true
  navigation-camera:
    position: [54.393201, 24.446266, 16] #for abu dhabi
    #position: [80.2707, 13.0827, 12] #for JV in tiles-jv @ dubai. Almahktoum and Sheik bin
    type: perspective
    active: false
    vanishing_point: [0, -0.45] #offset in ratio
