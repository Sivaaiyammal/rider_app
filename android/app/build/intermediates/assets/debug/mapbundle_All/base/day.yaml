  building:
    data: {source: r2hb, layer: building}
    building:
      enabled: true
      filter:
        $zoom: {min: 16}
      draw:
        polygons:
          style: polygons
          color: [0.875, 0.827, 0.796, 1.00]
          order: 9

    # turn interactive feature selection on for buildings with names
    # interactive:
    #     filter: { name: true }
    #     draw: { polygons: { interactive: true } }

    # extrude 3d buildings
    extruded:
      filter: {$zoom: {min: 16}}
      enabled: true
      draw:
        polygons:
          style: buildingVertexShaded
          extrude: true # #$zoom >= 14; }
          color: [0.875, 0.827, 0.796, 1.00]
          order: 20
        lines:
          style: heightglowline
          width: 1px
          color: [0.875, 0.827, 0.796, 1.00]
